# Displayed on the Team page. `ja` is not shown; it is there so names can be checked.
lead:
  name: Wakako Kumakura
  ja: 熊倉和歌子
  role: Principal investigator
  affiliation: Keio University
  text: >-
    Social and economic history of medieval and early modern Egypt and Syria, with a focus on land tenure,
    irrigation and the transmission of knowledge in the Mamluk and Ottoman periods. Author of a book on
    Nile irrigation and land tenure in medieval Egypt (2019); led the JSPS project "Connectivity Analysis
    with Digital Humanities Methods" (2019–2024); co-editor of two volumes on Islam and digital humanities.
members:
  - name: Takao Ito
    affiliation: "Kobe University"
    ja: 伊藤隆郎
    text: Social and cultural history of Egypt and Syria, 13th to 16th centuries, including networks of Muslim merchants in the 15th century.
  - name: Erina Ota
    affiliation: "The University of Tokyo"
    ja: 太田絵里奈
    text: Prosopography of the civilian elite of Mamluk cities, with al-Ḍawʾ al-Lāmiʿ as her main source. Visualised networks of scholars with RDF and studied teacher–student ties documented by ijāza.
  - name: Jun Ogawa
    affiliation: "The University of Tokyo"
    ja: 小川潤
    text: Digital humanities and Linked Open Data. Works on modelling narrative historical sources with temporal context, and convenes the Pelagios Network's Historical People SIG.
  - name: Gen Tsuchiyama
    affiliation: "Ochanomizu University"
    ja: 土山玄
    text: Text analysis. Applies quantitative methods to textual corpora, and in this project to networks in Islamic urban societies.
  - name: Toru Miura
    affiliation: "Toyo Bunko (The Oriental Library)"
    ja: 三浦徹
    text: Urban social history of the Arab-Islamic world, in particular Damascus. Author of Dynamism in the Urban Society of Damascus (2016); applies digital humanities methods to networks of Syrian scholars.

associates:
  - name: Tomoaki Shinoda
    affiliation: "Tohoku University"
    ja: 篠田知暁
    text: Political and social history of Muslims and Christians in the western Mediterranean. Applies network analysis to Arabic biographical sources to trace how Islamic learning spread over time.
  - name: Hiroaki Sawa
    affiliation: "The University of Tokyo"
    ja: 澤裕章
    text: ""

# Set to true only after the international collaborators have agreed to be named.
show_collaborators: false
collaborators:
  - name: Maxim Romanov
    affiliation: University of Hamburg
    text: Leads large-scale computational analysis of Arabic biographical collections; member of the KITAB project.
  - name: Jo Van Steenbergen
    affiliation: Ghent University
    text: Leads the Mamluk Prosopography Project, whose data will be linked to AINet-DB.
